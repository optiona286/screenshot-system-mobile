<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>BTC 選擇權專業報價</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div><p class="eyebrow">BTC OPTIONS · HISTORICAL</p><h1>T 字報價與互動 K 線</h1></div><button id="refreshBtn" class="icon-btn">↻</button></header><main><section class="market-card" id="captureArea">
<div class="market-head"><div><span class="muted">歷史交易日</span><strong id="spotPrice">--</strong></div><div class="right"><span id="status" class="status">連線中</span><small id="updatedAt">--</small></div></div>
<div class="controls"><label>資料日期<select id="dateSelect"></select></label><label>來源週期<select id="intervalSelect"><option value="15m">15 分</option><option value="1h" selected>1 小時</option></select></label><label>合約到期日<select id="expirySelect"></select></label><label>K 線週期<select id="periodSelect"><option value="source">原始週期</option><option value="1h">1 小時</option><option value="4h">4 小時</option></select></label></div>
<label class="search">搜尋履約價或合約<input id="strikeSearch" placeholder="例如 120000 或 BTC-..."></label>
<section class="chain-section"><div class="section-title"><div><b>T 字選擇權鏈</b><small>點擊 CALL 或 PUT 報價載入圖表</small></div><span id="chainCount">--</span></div><div class="chain-scroll"><table class="chain-table"><thead><tr><th>CALL 買權</th><th>履約價</th><th>PUT 賣權</th></tr></thead><tbody id="chainBody"><tr><td colspan="3" class="empty">正在載入歷史報價…</td></tr></tbody></table></div></section>
<section class="chart-section"><div class="instrument"><div><span class="muted">目前合約</span><h2 id="symbolLabel">尚未選擇</h2></div><div class="right"><strong id="lastPrice">--</strong><small id="changePct">--</small></div></div>
<div class="ohlc"><span>開<b id="openValue">--</b></span><span>高<b id="highValue">--</b></span><span>低<b id="lowValue">--</b></span><span>收<b id="closeValue">--</b></span><span>成交量<b id="volumeValue">--</b></span><span>成交筆數<b id="tradesValue">--</b></span></div>
<div class="chart-tools" id="chartTools"><button class="toggle active" data-indicator="ma7">MA7</button><button class="toggle" data-indicator="ma20">MA20</button><button class="toggle" data-indicator="bb">布林</button><button class="toggle active" data-indicator="highLow">高低</button><button class="toggle active" data-indicator="volume">成交量</button><button class="toggle" data-action="fit">顯示全部</button><button class="toggle" data-action="png">存 PNG</button></div>
<div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas><div id="chartTip" class="chart-tip"></div><div class="gesture-hint">拖曳平移 · 雙指或滾輪縮放 · 點按看 OHLC</div></div></section></section>
<button id="captureBtn" class="primary">下載完整報價畫面</button><p class="hint">歷史公開行情僅供參考，不構成投資建議。</p></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="history.js"></script></body></html>
