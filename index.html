<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <title>BTC Options 手機看盤</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>

    :root{
      color-scheme:dark;
      --bg:#000;
      --panel:#0a0a0a;
      --panel2:#151515;
      --panel3:#202020;
      --line:#2a2a2a;
      --line2:#3a3a3a;
      --text:#f1f1f1;
      --muted:#8a8a8a;
      --muted2:#666;
      --cyan:#4da7c5;
      --cyan2:#55b6d7;
      --up:#e00012;
      --down:#00b41f;
      --amber:#f4f20a;
      --blue:#0b2bbb;
      --navh:64px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;background:#000;color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100dvh}
    button,select,input{font:inherit}
    button{touch-action:manipulation}
    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      min-height:58px;padding:8px 12px;
      background:#111;border-bottom:1px solid #262626;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{
      width:34px;height:34px;display:grid;place-items:center;
      border:1px solid #454545;background:#1d1d1d;color:#fff;
      font-size:16px;font-weight:900;
    }
    .brand h1{margin:0;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .version{display:inline-block;margin-left:5px;padding:1px 5px;border:1px solid #4b4b4b;color:#a8a8a8;font-size:9px;vertical-align:2px}
    .subtitle{margin-top:2px;color:#777;font-size:10px}
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
    .status{max-width:290px;color:#999;font-size:10px;line-height:1.35;text-align:right}
    .status.ok{color:#bcbcbc}
    .status.ok::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--down)}
    .btn{
      border:1px solid #353535;border-radius:2px;background:#1c1c1c;color:#ddd;
      padding:7px 10px;cursor:pointer;font-size:11px;
    }
    .btn:active{background:#292929}
    .layout{
      display:grid;grid-template-columns:minmax(360px,430px) minmax(0,1fr);
      height:calc(100dvh - 59px);min-height:0;background:#000;
    }
    aside{
      display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr);
      min-height:0;overflow:hidden;border-right:1px solid #292929;background:#050505;
    }
    .controls,.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 9px 0}
    .chain-toolbar{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:8px;padding:8px 9px}
    .field label,.section-label{
      display:block;margin:0 0 4px;color:#777;font-size:10px;font-weight:500;letter-spacing:.02em;
    }
    select,input[type="search"]{
      width:100%;min-height:36px;border:1px solid #343434;border-radius:2px;background:#161616;color:#eee;
      padding:7px 8px;outline:none;font-size:12px;
    }
    select:focus,input:focus{border-color:#777}
    .chain-headline{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:8px 10px;border-top:1px solid #222;border-bottom:1px solid #222;background:#101010;
      color:#aaa;font-size:10px;
    }
    .chain-wrap{min-height:0;overflow:auto;background:#000;scrollbar-width:thin;scrollbar-color:#444 #111}
    .chain-table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
    .chain-table thead{position:sticky;top:0;z-index:5}
    .chain-table th{
      height:34px;padding:4px 2px;border-right:1px solid rgba(0,0,0,.25);border-bottom:1px solid #111;
      background:var(--cyan);color:#f4f4f4;text-align:center;font-size:12px;font-weight:500;
    }
    .chain-table .side-head th{height:29px;border:0;font-size:15px;font-weight:500}
    .chain-table .side-head .call-band{background:#a90000;color:#fff}
    .chain-table .side-head .put-band{background:#007d13;color:#fff}
    .chain-table .side-head .strike-cap{background:#050505;color:#777;border-left:1px solid #202020;border-right:1px solid #202020}
    .chain-table th:nth-child(1),.chain-table th:nth-child(5){width:18%}
    .chain-table th:nth-child(2),.chain-table th:nth-child(4){width:21%}
    .chain-table th:nth-child(3){width:22%}
    .chain-table td{
      height:56px;border-bottom:1px solid #262626;background:#000;color:#00d829;
      text-align:right;font-size:14px;font-weight:400;vertical-align:middle;
    }
    .quote,.quote-metric{
      cursor:pointer;padding:5px 8px;background:#000!important;color:#00d829!important;
    }
    .quote.put,.quote-metric.put{text-align:left}
    .quote.active,.quote-metric.active{background:#0a330f!important;box-shadow:inset 0 0 0 1px #00a71b}
    .quote:hover,.quote-metric:hover{background:#101010!important}
    .quote-metric{font-size:13px;color:#00d829!important}
    .last{display:block;color:inherit;font-size:15px}
    .chg{color:#00d829!important;font-size:13px}
    .chg.up,.chg.down{color:#00d829!important}
    .price-line{display:flex;align-items:center;justify-content:space-between;gap:5px}
    .quote.call .price-line{flex-direction:row-reverse}
    .subline{margin-top:3px;color:#777;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quote.call .subline{text-align:right}.quote.put .subline{text-align:left}
    .star{border:0;background:transparent;color:#666;padding:0 2px;font-size:12px;cursor:pointer}
    .star.saved{color:var(--amber)}
    .strike{
      padding:0!important;text-align:center!important;background:linear-gradient(#54acc9,#3e93b0)!important;
      color:var(--amber)!important;border-left:1px solid #172b33!important;border-right:1px solid #172b33!important;
    }
    .strike-button{
      width:100%;height:55px;border:0;background:transparent;color:var(--amber);
      font-size:15px;font-weight:600;cursor:pointer;
    }
    .strike-button small{display:block;color:#e5faff;font-size:8px;font-weight:400}
    .strike-button .btc-hint{display:block;margin-top:1px;color:#d8f4ff;font-size:7px;font-weight:400}
    .strike-button.active{outline:2px solid #fff4a8;outline-offset:-2px}
    .empty{padding:18px 10px;color:#888;font-size:11px;text-align:center}
    main{
      display:grid;grid-template-rows:auto auto minmax(0,1fr);
      min-width:0;min-height:0;overflow:hidden;background:#000;
    }
    .mobile-period-strip{display:none}
    .instrument{
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      padding:10px 12px;border-bottom:1px solid #222;background:#181818;
    }
    .instrument>div:first-child{min-width:0}
    .chart-kind{margin-bottom:4px;color:#999;font-size:10px}
    .instrument h2{margin:0;color:#ddd;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta,.source-info,.final-session{margin-top:4px;color:#808080;font-size:9px;line-height:1.45}
    .final-session{color:#d3a629}
    .last-price{text-align:right;flex-shrink:0}
    .last-price strong{display:block;font-size:25px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
    .change{margin-top:5px;font-size:10px}
    .cards{
      display:none;
    }
    .card{min-width:0;padding:8px 7px;border-right:1px solid #292929;background:#181818}
    .card:last-child{border-right:0}
    .card span{display:block;color:#777;font-size:9px}
    .card b{display:block;margin-top:4px;color:#d7d7d7;font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
    .chart-wrap{display:flex;flex-direction:column;min-height:0;background:#000;overflow:hidden}
    .chart-tools{
      display:flex;align-items:center;gap:0;overflow-x:auto;flex-shrink:0;
      min-height:41px;padding:0 8px;border-bottom:1px solid #252525;background:#111;scrollbar-width:none;
    }
    .chart-tools::-webkit-scrollbar{display:none}
    .toggle{
      flex:none;min-width:58px;height:40px;border:0;border-bottom:2px solid transparent;background:transparent;color:#777;
      padding:0 9px;font-size:10px;cursor:pointer;
    }
    .toggle.active{color:#e5e5e5;border-bottom-color:#fff}
    .toggle.active[data-indicator="ma7"]{color:#d5d000;border-bottom-color:#d5d000}
    .toggle.active[data-indicator="ma20"]{color:#20b9c1;border-bottom-color:#20b9c1}
    .toggle.active[data-indicator="bb"]{color:#9d7bff;border-bottom-color:#9d7bff}
    .chart-stage{position:relative;flex:1;min-height:260px;background:#000;overflow:hidden}
    canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
    .chart-message{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:12px;pointer-events:none}
    .chart-message[hidden]{display:none}
    .tooltip{
      position:absolute;z-index:10;display:none;top:6px;right:6px;left:auto;
      max-width:calc(100% - 12px);padding:5px 7px;border:1px solid #4a4a4a;
      background:rgba(8,8,8,.94);color:#eee;font-size:9px;line-height:1.25;
      pointer-events:none;white-space:nowrap;overflow-x:auto;scrollbar-width:none;
      box-shadow:0 2px 8px rgba(0,0,0,.35);
    }
    .tooltip::-webkit-scrollbar{display:none}
    .tip-head{display:inline-flex;align-items:center;gap:6px;margin-right:8px;padding-right:8px;border-right:1px solid #333;vertical-align:middle}
    .tip-time{font-weight:600;color:#f2f2f2}.tip-period{color:#aaa}
    .tip-grid{display:inline-grid;grid-auto-flow:column;grid-auto-columns:max-content;gap:0;vertical-align:middle}
    .tip-item{display:flex;align-items:baseline;gap:3px;padding:0 6px;border-right:1px solid #2a2a2a}
    .tip-item:last-child{border-right:0;padding-right:0}
    .tip-label{color:#777;font-size:8px}.tip-value{font-variant-numeric:tabular-nums;font-weight:600}
    .tooltip .up{color:var(--up)!important}.tooltip .down{color:var(--down)!important}
    .chart-footer{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-top:1px solid #252525;background:#0b0b0b;color:#6f6f6f;font-size:8px}
    .layout.focus{grid-template-columns:minmax(0,1fr)}.layout.focus aside{display:none}
    .mobile-nav{display:none}
    @media(max-width:980px){
      .layout{grid-template-columns:360px minmax(0,1fr)}
      .cards{grid-template-columns:repeat(4,1fr)}
    }
    @media(max-width:760px),(max-width:980px) and (pointer:coarse){

      /* Mobile visual-balance pass: reduce chrome, give the quote table / chart more vertical weight. */
      :root{--navh:48px}
      .topbar{min-height:42px;padding:4px 8px}
      .mark{width:24px;height:24px;font-size:11px}
      .brand{gap:7px}
      .brand h1{font-size:14px}
      .top-actions .status{font-size:7px;max-width:88px}
      .layout,.layout.focus{height:calc(100dvh - 42px - var(--navh))}
      .controls,.filters{padding:4px 6px 0;gap:5px}
      .field label{display:none}
      select,input[type="search"]{min-height:30px;margin-top:0;padding:4px 6px;font-size:11px}
      .chain-toolbar{padding:4px 6px;grid-template-columns:minmax(0,1fr) 58px;gap:5px}
      .chain-toolbar .field:last-child label{display:none}
      .chain-toolbar .btn{height:30px;padding:3px 6px;font-size:10px}
      .chain-headline{min-height:25px;padding:4px 7px;font-size:8px}
      .chain-table .side-head th{height:27px;font-size:14px}
      .chain-table th{height:30px;font-size:10px}
      .chain-table td{height:54px}
      .strike-button{height:53px}
      .mobile-period-strip{padding:4px 8px;min-height:35px}
      .mobile-period-strip select{min-height:27px;width:96px;padding:3px 5px}
      .instrument{padding:6px 9px}
      .instrument h2{font-size:14px}
      .chart-kind{margin-bottom:2px;font-size:8px}
      .meta,.source-info,.final-session{margin-top:2px;font-size:7px;line-height:1.25}
      .source-info{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
      .last-price strong{font-size:21px}
      .change{margin-top:3px;font-size:8px}
      .cards{display:none}
      .chart-tools{min-height:33px}
      .toggle{height:32px;min-width:50px;padding:0 7px;font-size:8px}
      .chart-footer{padding:3px 6px}
      .chart-stage{min-height:330px}
      .mobile-nav{height:calc(var(--navh) + env(safe-area-inset-bottom));padding-top:0}
      .mobile-nav button{font-size:10px}
      body{height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top)}
      .topbar{background:#121212;border-bottom-color:#242424}

      .subtitle{display:none}.version{display:none}
      .top-actions{gap:5px}.top-actions .status{max-width:105px;font-size:8px}
      .top-actions .btn{display:none}
      .mobile-nav{
        position:fixed;left:0;right:0;bottom:0;z-index:50;
        display:grid;grid-template-columns:1fr 1fr 1fr;
        height:calc(var(--navh) + env(safe-area-inset-bottom));
        padding:1px 8px env(safe-area-inset-bottom);border-top:1px solid #aaa;background:#d2d2d2;
      }
      .mobile-nav button{
        border:0;background:transparent;color:#444;font-size:10px;display:flex;align-items:center;justify-content:center;gap:3px;
      }
      .mobile-nav button[aria-pressed="true"]{color:#000;font-weight:700}
      .layout,.layout.focus{display:block;overflow:hidden}
      .layout[data-mobile-view="chain"] aside{display:grid;height:100%;border:0}
      .layout[data-mobile-view="chain"] main{display:none}
      .layout[data-mobile-view="chart"] aside{display:none}
      .layout[data-mobile-view="chart"] main{display:grid;height:100%;grid-template-rows:auto auto auto minmax(0,1fr)}







      .chain-table td{font-size:14px}
      .quote,.quote-metric{padding:4px 6px}
      .quote-metric{font-size:13px}.last{font-size:15px}
      .strike-button{font-size:15px}
      .mobile-period-strip{display:flex;align-items:center;gap:8px;border-bottom:1px solid #292929;background:#1b1b1b}
      .mobile-period-strip span{color:#777;font-size:10px}
      .mobile-period-strip select{margin:0;background:#151515;border-color:#444;color:#eee;font-size:11px}
      .instrument{background:#191919}
      .instrument h2{max-width:235px}


      .cards{background:#171717}

      .chart-tools{padding:0;background:#0c0c0c}


      .chart-footer{font-size:7px}
    }
    @media(max-width:390px){
      .top-actions .status{display:none}
      .chain-table th:nth-child(1),.chain-table th:nth-child(5){width:17%}
      .chain-table th:nth-child(2),.chain-table th:nth-child(4){width:22%}
      .chain-table th:nth-child(3){width:22%}
      .quote,.quote-metric{padding-left:4px;padding-right:4px}
      .subline{font-size:7px}
      .instrument h2{max-width:205px}
    }

  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">₿</div>
      <div>
        <h1>BTC 期權行情 <span class="version">3.0</span></h1>
        <div class="subtitle">期權鏈・歷史 K 線・BTC/USD 對照</div>
      </div>
    </div>
    <div class="top-actions">
      <div id="status" class="status" role="status" aria-live="polite">等待載入</div>
      <button id="autoRefresh" class="btn" aria-pressed="false" title="每 30 秒重讀；BTC 模式依契約時間區間查詢 API">自動重讀：關</button>
      <button id="focusChart" class="btn" aria-pressed="false">專注看盤</button>
    </div>
  </header>

  <nav class="mobile-nav" aria-label="手機看盤導覽">
    <button id="mobileChain" aria-pressed="true">▦ 報價</button>
    <button id="mobileChart" aria-pressed="false">⌁ K 線</button>
    <button id="mobileRefresh" aria-label="重新載入行情">↻ 重讀</button>
  </nav>
  <div class="layout" data-mobile-view="chain">
    <aside>
      <div class="controls">
        <div class="field">
          <label for="fileSelect">資料檔</label>
          <select id="fileSelect"></select>
        </div>
        <div class="field">
          <label for="periodSelect">K 線週期</label>
          <select id="periodSelect"></select>
        </div>
      </div>
      <div class="filters">
        <div class="field"><label for="expirySelect">到期日</label><select id="expirySelect"></select></div>
        <div class="field"><label for="chainMode">合約列表</label><select id="chainMode"><option value="strike">履約價排序</option><option value="volume">成交量優先</option><option value="favorites">★ 我的自選</option></select></div>
      </div>
      <div class="chain-toolbar">
        <div class="field" style="margin:0">
          <label for="search">搜尋履約價 / 合約</label>
          <input id="search" type="search" placeholder="65000 或 BTC-260624">
        </div>
        <div class="field" style="margin:0">
          <label>&nbsp;</label>
          <button id="refresh" class="btn">重讀</button>
        </div>
      </div>
      <div class="chain-headline">
        <span>T 字期權鏈 <span id="chainCount"></span></span>
        <span title="漲跌以檔案首根開盤至末根收盤計算">收盤價 / 區間漲跌</span>
      </div>
      <div class="chain-wrap">
        <table class="chain-table">
          <thead>
            <tr class="side-head">
              <th colspan="2" class="call-band">CALL</th>
              <th class="strike-cap"></th>
              <th colspan="2" class="put-band">PUT</th>
            </tr>
            <tr>
              <th>漲跌</th>
              <th>成交</th>
              <th title="點擊履約價，查看同時段 BTC/USD 技術分析">履約價</th>
              <th>成交</th>
              <th>漲跌</th>
            </tr>
          </thead>
          <tbody id="chainBody"></tbody>
        </table>
      </div>
    </aside>

    <main>
      <div class="mobile-period-strip"><span>週期</span><select id="mobilePeriod" aria-label="手機 K 線週期"></select></div>
      <section class="instrument">
        <div>
          <div id="chartKind" class="chart-kind">期權 K 線</div>
          <h2 id="symbolTitle">--</h2>
          <div id="symbolMeta" class="meta">請從左側期權鏈選擇 CALL 或 PUT</div>
          <div id="sourceInfo" class="source-info"></div>
          <div id="finalSessionInfo" class="final-session" hidden></div>
        </div>
        <div class="last-price">
          <strong id="lastPrice">--</strong>
          <div id="change" class="change">--</div>
        </div>
      </section>
      <section class="cards">
        <div class="card"><span>區間開</span><b id="openValue">--</b></div>
        <div class="card"><span>區間高</span><b id="highValue">--</b></div>
        <div class="card"><span>區間低</span><b id="lowValue">--</b></div>
        <div class="card"><span>區間收</span><b id="closeValue">--</b></div>
        <div class="card"><span id="volumeLabel">成交量</span><b id="volumeValue">--</b></div>
        <div class="card"><span>成交筆數</span><b id="tradesValue">--</b></div>
        <div class="card"><span>最後時間</span><b id="timeValue">--</b></div>
        <div class="card"><span>K 棒數</span><b id="barsValue">--</b></div>
      </section>
      <section class="chart-wrap" id="chartWrap">
        <div class="chart-tools">
          <button class="toggle active" data-indicator="ma7">MA7</button>
          <button class="toggle active" data-indicator="ma20">MA20</button>
          <button class="toggle" data-indicator="bb">布林</button>
          <button class="toggle active" data-indicator="highLow">高低價</button>
          <button class="toggle active" data-indicator="finalSession" title="到期前一天 16:00 至到期日 16:00（台灣時間）">最後 24h</button>
          <button class="toggle active" data-indicator="volume">成交量</button>
          <button class="toggle" data-action="latest">回到最新</button>
          <button class="toggle" data-action="zoomIn" aria-label="放大 K 線">＋</button>
          <button class="toggle" data-action="zoomOut" aria-label="縮小 K 線">－</button>
          <button class="toggle" data-action="fit">顯示全部</button>
          <button class="toggle" data-action="png">存 PNG</button>
          <button class="toggle" data-action="csv">匯出 CSV</button>
        </div>
        <div id="chartStage" class="chart-stage">
          <canvas id="chart" aria-label="期權 K 線圖，拖曳平移，滾輪縮放，雙擊回到最新"></canvas>
          <div id="chartMessage" class="chart-message">正在載入行情…</div>
          <div id="tooltip" class="tooltip"></div>
        </div>
        <div class="chart-footer"><span id="viewRange">--</span><span id="gestureHelp">拖曳平移 · 滾輪縮放 · 雙擊回到最新</span></div>
      </section>
    </main>
  </div>

  <script src="./data-api.js?ui=20261004-2"></script>
  <script>
    const state = {
      file: "",
      period: "",
      periods: [],
      symbols: [],
      chain: [],
      selected: "",
      rows: [],
      start: 0,
      visible: 80,
      hover: -1,
      dragging: false,
      dragX: 0,
      indicators: { ma7: true, ma20: true, bb: false, highLow: true, volume: true, finalSession: true },
      expiry: "", favorites: [], mode: "strike", autoRefresh: false,
      busy: false, metaBusy: false, requestId: 0, controller: null,
      studies: null, hoverY: null,
      crosshairPinned: false,
      view: "option",
    };

    const SETTINGS_KEY = "btc-options-workspace-v2";
    try {
      const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
      for (const key of ["file", "period", "selected", "expiry"]) {
        if (typeof saved[key] === "string") state[key] = saved[key];
      }
      if (["strike", "volume", "favorites"].includes(saved.mode)) state.mode = saved.mode;
      if (["option", "btc"].includes(saved.view)) state.view = saved.view;
      state.favorites = Array.isArray(saved.favorites) ? saved.favorites.filter((s) => typeof s === "string") : [];
      state.autoRefresh = saved.autoRefresh === true;
      for (const key of Object.keys(state.indicators)) {
        if (typeof saved.indicators?.[key] === "boolean") state.indicators[key] = saved.indicators[key];
      }
    } catch { /* Storage can be unavailable in a private browser session. */ }

    function saveSettings() {
      const { file, period, selected, expiry, mode, favorites, autoRefresh, indicators, view } = state;
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ file, period, selected, expiry, mode, favorites, autoRefresh, indicators, view })); } catch {}
    }

    const $ = (id) => document.getElementById(id);
    const ui = {
      file: $("fileSelect"),
      period: $("periodSelect"),
      expiry: $("expirySelect"),
      mode: $("chainMode"),
      search: $("search"),
      chain: $("chainBody"),
      count: $("chainCount"),
      status: $("status"),
      chart: $("chart"),
      wrap: $("chartWrap"),
      tip: $("tooltip"),
    };
    const ctx = ui.chart.getContext("2d");
    const mobileLayout = window.matchMedia("(max-width: 760px), (max-width: 980px) and (pointer: coarse)");
    function setMobileView(view) {
      document.querySelector(".layout").dataset.mobileView = view;
      $("mobileChain").setAttribute("aria-pressed", String(view === "chain"));
      $("mobileChart").setAttribute("aria-pressed", String(view === "chart"));
      hideTooltip();
      requestAnimationFrame(resizeAndDraw);
    }
    function updateMobileHelp() {
      $("gestureHelp").textContent = mobileLayout.matches ? "輕點顯示十字線 · 顯示後拖曳只移動十字線" : "移動滑鼠看十字線 · 拖曳平移 · 滾輪縮放";
      resizeAndDraw();
    }
    mobileLayout.addEventListener("change", updateMobileHelp);
    $("mobileChain").addEventListener("click", () => setMobileView("chain"));
    $("mobileChart").addEventListener("click", () => setMobileView("chart"));
    $("mobilePeriod").addEventListener("change", () => {
      ui.period.value = $("mobilePeriod").value;
      ui.period.dispatchEvent(new Event("change"));
    });
    $("mobileRefresh").addEventListener("click", () => loadMeta({ preserveFile: true, preserveView: true }));
    const fmt = (n, digits = 3) => Number(n || 0).toLocaleString("zh-TW", { maximumFractionDigits: digits });
    const compact = (n) => Intl.NumberFormat("zh-TW", { notation: "compact", maximumFractionDigits: 2 }).format(Number(n || 0));
    const pct = (n) => `${n >= 0 ? "+" : ""}${Number(n || 0).toFixed(1)}%`;
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

    async function getJson(url, controller) {
      const timeout = setTimeout(() => controller.abort(), 60000);
      try {
        if (window.historyApi) return await window.historyApi(url, controller.signal);
        const res = await fetch(url, { cache: "no-store", signal: controller.signal });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || "API 讀取失敗");
        return data;
      } finally { clearTimeout(timeout); }
    }

    function beginRequest() {
      state.controller?.abort();
      state.controller = new AbortController();
      state.busy = true;
      return { id: ++state.requestId, controller: state.controller };
    }

    function clearChart(message = "正在載入行情…") {
      state.rows = [];
      state.studies = null;
      $("finalSessionInfo").hidden = true;
      hideTooltip();
      $("chartMessage").textContent = message;
      $("chartMessage").hidden = false;
      for (const id of ["lastPrice", "change", "openValue", "highValue", "lowValue", "closeValue", "volumeValue", "tradesValue", "timeValue", "barsValue", "viewRange"]) $(id).textContent = "--";
      $("symbolTitle").textContent = state.view === "btc" ? "BTC / USD" : state.selected || "--";
      $("chartKind").textContent = state.view === "btc" ? "BTC 現貨 · 技術分析" : "期權 K 線";
      $("volumeLabel").textContent = state.view === "btc" ? "成交量（BTC）" : "成交量";
      $("sourceInfo").textContent = "";
      $("symbolMeta").textContent = "";
      resizeAndDraw();
    }

    async function loadMeta({ preserveFile = false, preserveView = false } = {}) {
      const request = beginRequest();
      state.metaBusy = true;
      if (!preserveView) clearChart();
      ui.status.className = "status";
      ui.status.textContent = "讀取 CSV...";
      const requested = preserveFile && state.file ? `?file=${encodeURIComponent(state.file)}` : "";
      try {
      const data = await getJson(`/api/meta${requested}`, request.controller);
      if (request.id !== state.requestId) return;
      state.file = data.file.name;
      state.fileInfo = data.file;
      state.symbols = data.symbols || [];
      state.chain = data.chain || [];
      state.periods = data.periods || [data.file.interval, "4h"];
      if (!state.periods.includes(state.period)) state.period = data.file.interval;
      const expiries = data.expiries || [...new Set(state.symbols.map((s) => s.expiryDate))].sort();
      if (state.expiry !== "all" && !expiries.includes(state.expiry)) {
        state.expiry = state.symbols.find((s) => s.symbol === state.selected)?.expiryDate || expiries[0] || "all";
      }
      ui.expiry.innerHTML = `<option value="all">全部到期日</option>` + expiries.map((expiry) => `<option value="${esc(expiry)}">${esc(expiry)}</option>`).join("");
      ui.expiry.value = state.expiry;
      ui.mode.value = state.mode;
      $("sourceInfo").textContent = `歷史 CSV · ${data.file.date} · 資料檔時間 ${new Date(data.file.modifiedAt).toLocaleString("zh-TW", { hour12: false, timeZone: "Asia/Taipei" })} · 台北時間`;

      ui.file.innerHTML = data.files.map((file) =>
        `<option value="${esc(file.name)}" ${file.name === state.file ? "selected" : ""}>${file.date} ｜ ${file.interval} ｜ ${(file.size / 1024).toFixed(0)} KB</option>`
      ).join("");
      ui.period.innerHTML = state.periods.map((period) =>
        `<option value="${period}" ${period === state.period ? "selected" : ""}>${period.toUpperCase()}</option>`
      ).join("");
      $("mobilePeriod").innerHTML = ui.period.innerHTML;

      ui.status.className = "status ok";
      ui.status.textContent = `${data.rowCount.toLocaleString()} 筆 ｜ ${data.symbolCount} 合約 ｜ ${data.file.date} ${data.file.interval}`;
      renderChain();

      state.metaBusy = false;
      const available = state.symbols.filter((s) => state.expiry === "all" || s.expiryDate === state.expiry);
      if (!available.some((item) => item.symbol === state.selected)) {
        const mostActive = [...available].sort((a, b) => b.volume - a.volume)[0];
        if (mostActive) await selectSymbol(mostActive.symbol, { view: state.view });
        else { state.selected = ""; clearChart("此資料檔沒有可用合約"); saveSettings(); }
      } else {
        await selectSymbol(state.selected, { preserveView, view: state.view });
      }
      } catch (error) {
        if (request.id === state.requestId) showError(error);
      } finally {
        if (request.id === state.requestId) { state.busy = false; state.metaBusy = false; }
      }
    }

    function renderChain() {
      const q = ui.search.value.trim().toLowerCase();
      const rows = state.chain.filter((row) => {
        if (state.expiry !== "all" && row.expiryDate !== state.expiry) return false;
        if (state.mode === "favorites" && ![row.call, row.put].some((s) => s && state.favorites.includes(s.symbol))) return false;
        const text = [
          row.strikePrice,
          row.expiryDate,
          row.call?.symbol,
          row.put?.symbol,
        ].filter(Boolean).join(" ").toLowerCase();
        return !q || text.includes(q);
      });
      if (state.mode === "volume") rows.sort((a, b) => ((b.call?.volume || 0) + (b.put?.volume || 0)) - ((a.call?.volume || 0) + (a.put?.volume || 0)));
      ui.count.textContent = `(${rows.length})`;
      ui.chain.innerHTML = rows.map((row) => `
        <tr>
          ${quoteCell(row.call, "call")}
          <td class="strike">${strikeButton(row)}</td>
          ${quoteCell(row.put, "put")}
        </tr>
      `).join("") || `<tr><td colspan="5"><div class="empty">${state.mode === "favorites" ? "此篩選下尚無自選合約，點選報價旁的 ☆ 即可加入。" : "沒有符合條件的期權，試著更換到期日或清除搜尋。"}</div></td></tr>`;
    }

    function quoteCell(item, sideClass) {
      if (!item) {
        return sideClass === "call"
          ? `<td class="quote-metric call">--</td><td class="quote call"><span class="last">--</span></td>`
          : `<td class="quote put"><span class="last">--</span></td><td class="quote-metric put">--</td>`;
      }
      const direction = item.changePct >= 0 ? "up" : "down";
      const active = state.view === "option" && item.symbol === state.selected ? "active" : "";
      const priceCell = `<td class="quote ${sideClass} ${active}" data-symbol="${esc(item.symbol)}" title="${esc(item.symbol)}" tabindex="0" aria-label="選擇 ${esc(item.symbol)}">
        <span class="last">${fmt(item.close)}</span>
        <div class="subline"><button class="star ${state.favorites.includes(item.symbol) ? "saved" : ""}" data-star="${esc(item.symbol)}" aria-label="自選 ${esc(item.symbol)}" aria-pressed="${state.favorites.includes(item.symbol)}">${state.favorites.includes(item.symbol) ? "★" : "☆"}</button>量 ${compact(item.volume)}</div>
      </td>`;
      const changeCell = `<td class="quote-metric ${sideClass} ${active}" data-symbol="${esc(item.symbol)}" title="${esc(item.symbol)}">${pct(item.changePct)}</td>`;
      return sideClass === "call" ? changeCell + priceCell : priceCell + changeCell;
    }

    function strikeButton(row) {
      const reference = [row.call, row.put].find((item) => item?.symbol === state.selected) || row.call || row.put;
      if (!reference) return fmt(row.strikePrice, 0);
      const active = state.view === "btc" && [row.call, row.put].some((item) => item?.symbol === state.selected);
      return `<button class="strike-button ${active ? "active" : ""}" data-btc-symbol="${esc(reference.symbol)}" aria-pressed="${active}" title="查看 ${esc(row.expiryDate)} 到期、履約價 ${fmt(row.strikePrice, 0)} 對應時段的 BTC/USD K 線">${fmt(row.strikePrice, 0)}${state.expiry === "all" ? `<small>${esc(row.expiryDate)}</small>` : ""}<span class="btc-hint">${active ? "BTC 顯示中" : "BTC/USD"}</span></button>`;
    }

    async function selectSymbol(symbol, { preserveView = false, view = "option" } = {}) {
      if (state.metaBusy) return;
      preserveView = preserveView && state.rows.length > 0 && state.view === view && state.selected === symbol;
      const request = beginRequest();
      const oldStart = state.start;
      const oldVisible = state.visible;
      const atEnd = state.start + state.visible >= state.rows.length;
      state.selected = symbol;
      state.view = view;
      if (!preserveView) clearChart();
      else hideTooltip();
      renderChain();
      ui.status.className = "status";
      const chartSymbol = view === "btc" ? "BTC/USD" : symbol;
      ui.status.textContent = `讀取 ${chartSymbol} ${state.period.toUpperCase()}${view === "btc" ? " · 契約對應時段" : ""}...`;
      try {
        const route = view === "btc" ? "/api/btc-klines" : "/api/klines";
        const data = await getJson(`${route}?file=${encodeURIComponent(state.file)}&symbol=${encodeURIComponent(symbol)}&period=${encodeURIComponent(state.period)}`, request.controller);
        if (request.id !== state.requestId) return;
        state.rows = data.items || [];
        state.studies = { ma7: movingAverage(state.rows, 7), ma20: movingAverage(state.rows, 20), bb: bollinger(state.rows) };
        state.visible = Math.min(state.rows.length, preserveView && oldVisible > 0 ? oldVisible : defaultVisible());
        state.start = preserveView && !atEnd ? Math.max(0, Math.min(oldStart, state.rows.length - state.visible)) : Math.max(0, state.rows.length - state.visible);
        $("chartMessage").hidden = state.rows.length > 0;
        $("chartMessage").textContent = "此合約沒有可顯示的 K 線";
        if (!state.rows.length) clearChart("此合約沒有可顯示的 K 線");
        updateSummary(data);
        resizeAndDraw();
        ui.status.className = "status ok";
        ui.status.textContent = `${chartSymbol} ｜ ${data.period.toUpperCase()} ｜ ${data.count} 根 K 棒`;
        saveSettings();
      } catch (error) {
        if (request.id === state.requestId) {
          clearChart("載入失敗，請按「重讀」重試");
          showError(error);
        }
      } finally {
        if (request.id === state.requestId) state.busy = false;
      }
    }

    function updateSummary(data) {
      const rows = state.rows;
      const info = state.symbols.find((item) => item.symbol === state.selected);
      if (!rows.length || !info) return;
      const first = rows[0];
      const last = rows.at(-1);
      const change = first.open ? ((last.close / first.open) - 1) * 100 : 0;
      const isBtc = data.market === "btc";
      $("symbolTitle").textContent = isBtc ? "BTC / USD" : state.selected;
      $("chartKind").textContent = isBtc ? "BTC 現貨 · 技術分析" : "期權 K 線";
      $("volumeLabel").textContent = isBtc ? "成交量（BTC）" : "成交量";
      $("symbolMeta").textContent = `到期 ${info.expiryDate} ｜ 履約價 ${fmt(info.strikePrice, 0)} ｜ ${isBtc ? "對應時段 BTC 現貨" : info.side} ｜ ${data.period.toUpperCase()}${data.period !== data.sourceInterval ? `（由 ${data.sourceInterval} 聚合）` : ""}`;
      $("sourceInfo").textContent = isBtc
        ? `${data.provider} · 契約資料 ${data.range.optionStart} ～ ${data.range.optionEnd} · 台北時間${data.missingSourceBars ? ` · 來源缺少 ${data.missingSourceBars} 根 K 棒` : ""}`
        : `歷史 CSV · ${data.file.date} · 檔案更新 ${new Date(data.file.modifiedAt).toLocaleString("zh-TW", { hour12: false, timeZone: "Asia/Taipei" })} · 台北時間`;
      $("lastPrice").textContent = fmt(last.close);
      $("lastPrice").style.color = change >= 0 ? "var(--up)" : "var(--down)";
      $("change").textContent = `${change >= 0 ? "+" : ""}${change.toFixed(2)}%（目前載入區間）`;
      $("change").style.color = change >= 0 ? "var(--up)" : "var(--down)";
      $("openValue").textContent = fmt(first.open);
      $("highValue").textContent = fmt(Math.max(...rows.map((r) => r.high)));
      $("lowValue").textContent = fmt(Math.min(...rows.map((r) => r.low)));
      $("closeValue").textContent = fmt(last.close);
      $("volumeValue").textContent = fmt(rows.reduce((sum, r) => sum + r.volume, 0), 2);
      $("tradesValue").textContent = isBtc ? "--" : fmt(rows.reduce((sum, r) => sum + r.trades, 0), 0);
      $("tradesValue").title = isBtc ? "Coinbase K 線 API 未提供成交筆數" : "";
      $("timeValue").textContent = last.time.slice(5, 16);
      $("barsValue").textContent = rows.length.toLocaleString();
    }

    function movingAverage(rows, period) {
      const result = Array(rows.length).fill(null);
      let sum = 0;
      for (let i = 0; i < rows.length; i += 1) {
        sum += rows[i].close;
        if (i >= period) sum -= rows[i - period].close;
        if (i >= period - 1) result[i] = sum / period;
      }
      return result;
    }

    function bollinger(rows, period = 20) {
      const mid = movingAverage(rows, period);
      return rows.map((_, i) => {
        if (i < period - 1) return null;
        const values = rows.slice(i - period + 1, i + 1).map((r) => r.close);
        const variance = values.reduce((sum, value) => sum + (value - mid[i]) ** 2, 0) / period;
        const sd = Math.sqrt(variance);
        return { upper: mid[i] + 2 * sd, lower: mid[i] - 2 * sd };
      });
    }

    function finalSessionWindow() {
      const expiry = state.symbols.find((item) => item.symbol === state.selected)?.expiryDate;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(expiry || "")) return null;
      const end = Date.parse(`${expiry}T16:00:00+08:00`);
      if (!Number.isFinite(end)) return null;
      return { start: end - 24 * 3600000, end };
    }

    function barTaiwanTime(row) {
      return Date.parse(String(row.time).replace(" ", "T") + "+08:00");
    }

    function taiwanTimeLabel(time) {
      return new Date(time + 8 * 3600000).toISOString().slice(0, 16).replace("T", " ");
    }

    function drawFinalSession(rows, left, top, plotW, chartBottom) {
      const session = finalSessionWindow();
      const caption = $("finalSessionInfo");
      caption.hidden = !session || !state.indicators.finalSession;
      if (caption.hidden) return;
      const duration = ({ "15m": 15, "1h": 60, "4h": 240 }[state.period] || 60) * 60000;
      const overlaps = (row) => {
        const time = barTaiwanTime(row);
        return time < session.end && time + duration > session.start;
      };
      const hasVisible = rows.some(overlaps);
      const hasLoaded = hasVisible || state.rows.some(overlaps);
      caption.textContent = `最後 24 小時 · ${taiwanTimeLabel(session.start)} ～ ${taiwanTimeLabel(session.end)}（台灣時間）${!hasLoaded ? " · 載入資料尚無此區間" : !hasVisible ? " · 此區間在目前視窗外" : ""}`;
      if (!hasVisible) return;
      const step = plotW / rows.length;
      ctx.save();
      ctx.fillStyle = "rgba(245,185,66,.10)";
      rows.forEach((row, i) => {
        const time = barTaiwanTime(row);
        if (!Number.isFinite(time) || !overlaps(row)) return;
        const from = Math.max(0, (session.start - time) / duration);
        const to = Math.min(1, (session.end - time) / duration);
        ctx.fillRect(left + (i + from) * step, top, (to - from) * step, chartBottom - top);
      });
      // Place a boundary only where a loaded candle actually reaches that time.
      // Missing candles and off-screen boundaries are never invented.
      const boundaryX = (time) => {
        const index = rows.findIndex((row) => {
          const start = barTaiwanTime(row);
          return time >= start && time <= start + duration;
        });
        return index < 0 ? null : left + (index + (time - barTaiwanTime(rows[index])) / duration) * step;
      };
      let lastLabelRight = -Infinity;
      for (const [time, label] of [[session.start, "起"], [session.end, "迄"]]) {
        const px = boundaryX(time);
        if (px === null) continue;
        ctx.strokeStyle = "rgba(245,185,66,.8)";
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(px, top);
        ctx.lineTo(px, chartBottom);
        ctx.stroke();
        ctx.setLineDash([]);
        const text = `${label} ${taiwanTimeLabel(time).slice(5)}`;
        ctx.font = "11px Segoe UI, Microsoft JhengHei";
        const width = ctx.measureText(text).width;
        const textX = Math.max(left, Math.min(left + plotW - width, px + 4));
        if (textX < lastLabelRight + 8) continue;
        ctx.fillStyle = "#f5b942";
        ctx.textAlign = "left";
        ctx.fillText(text, textX, top - 5);
        lastLabelRight = textX + width;
      }
      ctx.restore();
    }

    function resizeAndDraw() {
      const rect = $("chartStage").getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      ui.chart.width = Math.max(1, Math.round(rect.width * dpr));
      ui.chart.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      const w = ui.chart.clientWidth;
      const h = ui.chart.clientHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, w, h);
      if (!state.rows.length || w < 120 || h < 100) return;

      const left = 12;
      const right = 72;
      const top = 18;
      const bottom = 27;
      const volumeHeight = state.indicators.volume ? Math.min(105, h * .2) : 0;
      const priceBottom = h - bottom - volumeHeight;
      state.visible = Math.min(state.visible, state.rows.length);
      state.start = Math.max(0, Math.min(state.start, state.rows.length - state.visible));
      const end = state.start + state.visible;
      const rows = state.rows.slice(state.start, end);
      const allMa7 = state.studies.ma7;
      const allMa20 = state.studies.ma20;
      const allBb = state.studies.bb;
      $("viewRange").textContent = `${rows[0].time.slice(5, 16)} → ${rows.at(-1).time.slice(5, 16)} · ${rows.length} / ${state.rows.length} 根`;
      const values = rows.flatMap((r) => [r.high, r.low]);
      if (state.indicators.ma7) values.push(...allMa7.slice(state.start, end).filter(Number.isFinite));
      if (state.indicators.ma20) values.push(...allMa20.slice(state.start, end).filter(Number.isFinite));
      if (state.indicators.bb) allBb.slice(state.start, end).filter(Boolean).forEach((b) => values.push(b.upper, b.lower));

      let min = Math.min(...values);
      let max = Math.max(...values);
      const padding = Math.max((max - min) * .08, max * .005, .01);
      min = Math.max(0, min - padding);
      max += padding;
      const plotW = w - left - right;
      const plotH = priceBottom - top;
      const x = (i) => left + (i + .5) * plotW / rows.length;
      const y = (value) => top + (max - value) / (max - min || 1) * plotH;

      drawFinalSession(rows, left, top, plotW, h - bottom);

      ctx.strokeStyle = "#262626";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#9a9a9a";
      ctx.font = "11px Segoe UI";
      ctx.textAlign = "left";
      for (let i = 0; i <= 5; i += 1) {
        const gy = top + plotH * i / 5;
        ctx.beginPath();
        ctx.moveTo(left, gy);
        ctx.lineTo(w - right, gy);
        ctx.stroke();
        ctx.fillText(fmt(max - (max - min) * i / 5), w - right + 8, gy + 4);
      }
      const labelEvery = Math.max(1, Math.ceil(rows.length / Math.max(1, Math.floor(plotW / 100))));
      rows.forEach((row, i) => {
        if (i % labelEvery !== 0) return;
        const gx = x(i);
        ctx.beginPath();
        ctx.moveTo(gx, top);
        ctx.lineTo(gx, h - bottom);
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.fillText(row.time.slice(5, 16), gx, h - 8);
      });

      const step = plotW / rows.length;
      const candleW = Math.max(.5, step * .94);

      if (rows.length > 1) {
        const shade = ctx.createLinearGradient(0, top, 0, priceBottom);
        shade.addColorStop(0, "rgba(0,92,145,.12)");
        shade.addColorStop(1, "rgba(0,78,120,.36)");
        ctx.beginPath();
        ctx.moveTo(x(0), y(rows[0].close));
        rows.forEach((row, i) => ctx.lineTo(x(i), y(row.close)));
        ctx.lineTo(x(rows.length - 1), priceBottom);
        ctx.lineTo(x(0), priceBottom);
        ctx.closePath();
        ctx.fillStyle = shade;
        ctx.fill();
      }

      rows.forEach((row, i) => {
        const cx = x(i);
        const color = row.close >= row.open ? "#ea3943" : "#16c784";
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = Math.min(candleW, Math.max(1, Math.min(3, candleW * .14)));
        ctx.beginPath();
        ctx.moveTo(cx, y(row.high));
        ctx.lineTo(cx, y(row.low));
        ctx.stroke();
        const bodyTop = y(Math.max(row.open, row.close));
        const bodyHeight = Math.max(2, Math.abs(y(row.open) - y(row.close)));
        ctx.fillRect(cx - candleW / 2, bodyTop, candleW, bodyHeight);
      });

      function line(valuesToDraw, color, width = 1.5) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        let started = false;
        valuesToDraw.forEach((value, i) => {
          if (!Number.isFinite(value)) {
            started = false;
            return;
          }
          if (!started) {
            ctx.moveTo(x(i), y(value));
            started = true;
          } else {
            ctx.lineTo(x(i), y(value));
          }
        });
        ctx.stroke();
      }
      if (state.indicators.ma7) line(allMa7.slice(state.start, end), "#f5b942");
      if (state.indicators.ma20) line(allMa20.slice(state.start, end), "#42c8f5");
      if (state.indicators.bb) {
        line(allBb.slice(state.start, end).map((b) => b?.upper), "#9d7bff", 1);
        line(allBb.slice(state.start, end).map((b) => b?.lower), "#9d7bff", 1);
      }

      function drawPriceTag(index, value, label, color, placeAbove) {
        const px = x(index);
        const py = y(value);
        const text = `${label} ${fmt(value)}`;
        ctx.save();
        ctx.font = "700 12px Segoe UI";
        const boxW = Math.ceil(ctx.measureText(text).width) + 14;
        const boxH = 22;
        let boxX = px + 10;
        if (boxX + boxW > w - right - 4) boxX = px - boxW - 10;
        if (boxX < left + 4) boxX = left + 4;
        let boxY = placeAbove ? py - boxH - 8 : py + 8;
        if (boxY < top + 4) boxY = py + 8;
        if (boxY + boxH > priceBottom - 4) boxY = py - boxH - 8;
        boxY = Math.max(top + 4, Math.min(priceBottom - boxH - 4, boxY));

        const lineEndX = boxX > px ? boxX : boxX + boxW;
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(lineEndX, py);
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(9,13,20,.92)";
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeRect(boxX + .5, boxY + .5, boxW - 1, boxH - 1);
        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, boxX + boxW / 2, boxY + boxH / 2 + .5);
        ctx.restore();
      }

      if (state.indicators.highLow && rows.length) {
        let highIndex = 0;
        let lowIndex = 0;
        rows.forEach((row, i) => {
          if (row.high > rows[highIndex].high) highIndex = i;
          if (row.low < rows[lowIndex].low) lowIndex = i;
        });
        drawPriceTag(highIndex, rows[highIndex].high, "最高", "#ea3943", true);
        drawPriceTag(lowIndex, rows[lowIndex].low, "最低", "#16c784", false);
      }

      if (volumeHeight) {
        const volumeTop = priceBottom + 12;
        const maxVolume = Math.max(1, ...rows.map((r) => r.volume));
        ctx.fillStyle = "#9a9a9a";
        ctx.textAlign = "left";
        ctx.fillText(`成交量 最大 ${fmt(maxVolume, 2)}`, left, volumeTop + 2);
        rows.forEach((row, i) => {
          const barH = (row.volume / maxVolume) * (volumeHeight - 24);
          ctx.fillStyle = row.close >= row.open ? "rgba(234,57,67,.62)" : "rgba(22,199,132,.62)";
          ctx.fillRect(x(i) - candleW / 2, h - bottom - barH, candleW, barH);
        });
      }

      if (state.hover >= state.start && state.hover < end) {
        const local = state.hover - state.start;
        const cx = x(local);
        const cy = Math.max(top, Math.min(priceBottom, state.hoverY ?? top));
        ctx.strokeStyle = "#d8d8d8";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(cx, top);
        ctx.lineTo(cx, h - bottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(left, cy);
        ctx.lineTo(w - right, cy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#344154";
        ctx.fillRect(w - right, cy - 10, right, 20);
        ctx.fillStyle = "#e6edf7";
        ctx.textAlign = "left";
        ctx.fillText(fmt(max - (cy - top) / plotH * (max - min)), w - right + 5, cy + 4);
      }
    }

    function showTooltip(event, pin = false) {
      if (!state.rows.length) return;
      const rect = ui.chart.getBoundingClientRect();
      const left = 12;
      const right = 72;
      const localX = event.clientX - rect.left;
      const index = Math.floor((localX - left) / (rect.width - left - right) * state.visible);
      if (index < 0 || index >= state.visible) {
        if (!state.crosshairPinned) hideTooltip();
        draw();
        return;
      }
      state.hover = state.start + index;
      state.hoverY = Math.max(18, Math.min(rect.height - 27, event.clientY - rect.top));
      if (pin) state.crosshairPinned = true;
      const row = state.rows[state.hover];
      if (!row) return;
      const direction = row.close >= row.open ? "up" : "down";
      const barChange = row.open ? ((row.close / row.open) - 1) * 100 : 0;
      ui.tip.innerHTML = `
        <div class="tip-head">
          <span class="tip-time">${esc(row.time)}</span>
          <span class="tip-period">${state.period.toUpperCase()}</span>
        </div>
        <div class="tip-grid">
          <span class="tip-item"><span class="tip-label">開</span><span class="tip-value">${fmt(row.open)}</span></span>
          <span class="tip-item"><span class="tip-label">高</span><span class="tip-value up">${fmt(row.high)}</span></span>
          <span class="tip-item"><span class="tip-label">低</span><span class="tip-value down">${fmt(row.low)}</span></span>
          <span class="tip-item"><span class="tip-label">收</span><span class="tip-value ${direction}">${fmt(row.close)}</span></span>
          <span class="tip-item"><span class="tip-label">漲跌</span><span class="tip-value ${direction}">${barChange >= 0 ? "+" : ""}${barChange.toFixed(2)}%</span></span>
          <span class="tip-item"><span class="tip-label">量</span><span class="tip-value">${fmt(row.volume, 2)}</span></span>
          ${state.view === "btc" ? "" : `<span class="tip-item"><span class="tip-label">筆</span><span class="tip-value">${fmt(row.trades, 0)}</span></span>`}
        </div>`;
      ui.tip.style.display = "block";
      ui.tip.style.left = "auto";
      ui.tip.style.right = "6px";
      ui.tip.style.top = "6px";
      draw();
    }

    function hideTooltip() {
      state.hover = -1;
      state.hoverY = null;
      state.crosshairPinned = false;
      ui.tip.style.display = "none";
    }

    function defaultVisible() {
      return Math.max(15, Math.min(80, Math.floor((ui.chart.clientWidth - 84) / 11)));
    }

    function latest() {
      state.visible = Math.min(state.rows.length, defaultVisible());
      state.start = Math.max(0, state.rows.length - state.visible);
      hideTooltip();
      draw();
    }

    function zoom(delta, ratio = .5) {
      if (!state.rows.length) return;
      const old = state.visible;
      const next = Math.min(state.rows.length, Math.max(Math.min(8, state.rows.length), old + delta));
      const anchor = state.start + Math.floor(old * ratio);
      state.visible = next;
      state.start = Math.max(0, Math.min(state.rows.length - next, anchor - Math.floor(next * ratio)));
      hideTooltip();
      draw();
    }

    function exportCsv() {
      if (!state.rows.length) return;
      const keys = ["time", "open", "high", "low", "close", "volume", "quoteVolume", "trades"];
      const csv = [keys, ...state.rows.map((row) => keys.map((key) => row[key]))].map((row) => row.map((value) => `"${String(value ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `${state.view === "btc" ? "BTC-USD_" : ""}${state.selected}-${state.period}-${state.fileInfo.date}.csv`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    ui.file.addEventListener("change", async () => {
      state.file = ui.file.value;
      state.selected = "";
      $("sourceInfo").textContent = "";
      await loadMeta({ preserveFile: true }).catch(showError);
    });
    ui.period.addEventListener("change", async () => {
      state.period = ui.period.value;
      $("mobilePeriod").value = state.period;
      if (state.selected) await selectSymbol(state.selected, { view: state.view });
    });
    ui.expiry.addEventListener("change", () => {
      state.expiry = ui.expiry.value;
      saveSettings();
      renderChain();
      if (state.expiry !== "all" && !state.symbols.some((s) => s.symbol === state.selected && s.expiryDate === state.expiry)) {
        const next = state.symbols.filter((s) => s.expiryDate === state.expiry).sort((a, b) => b.volume - a.volume)[0];
        if (next) selectSymbol(next.symbol, { view: state.view });
      }
    });
    ui.mode.addEventListener("change", () => { state.mode = ui.mode.value; saveSettings(); renderChain(); });
    ui.search.addEventListener("input", renderChain);
    ui.chain.addEventListener("click", (event) => {
      const strike = event.target.closest("[data-btc-symbol]");
      if (strike) {
        if (mobileLayout.matches) setMobileView("chart");
        selectSymbol(strike.dataset.btcSymbol, { view: "btc" }); return;
      }
      const star = event.target.closest("[data-star]");
      if (star) {
        const symbol = star.dataset.star;
        state.favorites = state.favorites.includes(symbol) ? state.favorites.filter((s) => s !== symbol) : [...state.favorites, symbol];
        saveSettings();
        renderChain();
        return;
      }
      const cell = event.target.closest("[data-symbol]");
      if (cell) {
        if (mobileLayout.matches) setMobileView("chart");
        selectSymbol(cell.dataset.symbol);
      }
    });
    ui.chain.addEventListener("keydown", (event) => {
      if (["Enter", " "].includes(event.key) && event.target.matches("td[data-symbol]")) { event.preventDefault(); event.target.click(); }
    });
    $("refresh").addEventListener("click", () => loadMeta({ preserveFile: true, preserveView: true }));
    function updateAutoButton() {
      $("autoRefresh").textContent = `自動重讀：${state.autoRefresh ? "30 秒" : "關"}`;
      $("autoRefresh").setAttribute("aria-pressed", String(state.autoRefresh));
    }
    $("autoRefresh").addEventListener("click", () => { state.autoRefresh = !state.autoRefresh; saveSettings(); updateAutoButton(); });
    $("focusChart").addEventListener("click", () => {
      const focus = document.querySelector(".layout").classList.toggle("focus");
      $("focusChart").textContent = focus ? "顯示期權鏈" : "專注看盤";
      $("focusChart").setAttribute("aria-pressed", String(focus));
      hideTooltip();
      resizeAndDraw();
    });
    setInterval(() => {
      if (state.autoRefresh && !state.busy && !state.dragging && !document.hidden) loadMeta({ preserveFile: true, preserveView: true });
    }, 30000);
    ui.wrap.addEventListener("click", (event) => {
      const button = event.target.closest(".toggle");
      if (!button) return;
      if (button.dataset.indicator) {
        const key = button.dataset.indicator;
        state.indicators[key] = !state.indicators[key];
        button.classList.toggle("active", state.indicators[key]);
        button.setAttribute("aria-pressed", String(state.indicators[key]));
        saveSettings();
        draw();
      } else if (button.dataset.action === "fit") {
        state.visible = state.rows.length;
        state.start = 0;
        hideTooltip();
        draw();
      } else if (button.dataset.action === "latest") {
        latest();
      } else if (button.dataset.action === "zoomIn") {
        zoom(-10);
      } else if (button.dataset.action === "zoomOut") {
        zoom(10);
      } else if (button.dataset.action === "csv") {
        exportCsv();
      } else if (button.dataset.action === "png") {
        if (!state.rows.length) return;
        hideTooltip();
        draw();
        const link = document.createElement("a");
        link.download = `${state.view === "btc" ? "BTC-USD_" : ""}${state.selected || "BTC-options"}-${state.period}-kline.png`;
        link.href = ui.chart.toDataURL("image/png");
        link.click();
      }
    });
    const chartPointers = new Map();
    let pinch = null;
    let pointerMoved = false;
    let pointerOrigin = null;
    function beginPinch() {
      const [a, b] = [...chartPointers.values()];
      if (!a || !b) return;
      const rect = ui.chart.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, ((a.x + b.x) / 2 - rect.left - 12) / Math.max(1, rect.width - 84)));
      pinch = { distance: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), visible: state.visible, anchor: state.start + state.visible * ratio };
      pointerMoved = true;
      hideTooltip();
    }
    ui.chart.addEventListener("pointermove", (event) => {
      if (chartPointers.has(event.pointerId)) chartPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      // Once a touch crosshair is pinned, the chart viewport is frozen.
      // One-finger movement only moves the crosshair / selected candle.
      if (event.pointerType === "touch" && state.crosshairPinned && chartPointers.size <= 1) {
        pointerMoved = true;
        showTooltip(event, true);
        return;
      }

      if (chartPointers.size >= 2 && pinch && state.rows.length && !state.crosshairPinned) {
        const [a, b] = [...chartPointers.values()];
        const distance = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
        const rect = ui.chart.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, ((a.x + b.x) / 2 - rect.left - 12) / Math.max(1, rect.width - 84)));
        state.visible = Math.min(state.rows.length, Math.max(Math.min(8, state.rows.length), Math.round(pinch.visible * pinch.distance / distance)));
        state.start = Math.max(0, Math.min(state.rows.length - state.visible, Math.round(pinch.anchor - state.visible * ratio)));
        draw();
      } else if (state.dragging && state.rows.length && !state.crosshairPinned) {
        if (pointerOrigin && Math.hypot(event.clientX - pointerOrigin.x, event.clientY - pointerOrigin.y) > 5) pointerMoved = true;
        if (!pointerMoved) return;
        const step = (ui.chart.clientWidth - 84) / state.visible;
        const shift = Math.round((state.dragX - event.clientX) / Math.max(step, 1));
        if (shift) {
          state.start = Math.max(0, Math.min(state.rows.length - state.visible, state.start + shift));
          state.dragX = event.clientX;
          draw();
        }
      } else if (event.pointerType !== "touch") {
        showTooltip(event);
      }
    });
    ui.chart.addEventListener("pointerleave", () => {
      if (!state.crosshairPinned) {
        hideTooltip();
        draw();
      }
    });
    ui.chart.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      chartPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (chartPointers.size === 1) {
        pointerOrigin = { x: event.clientX, y: event.clientY };
        pointerMoved = false;
      }
      ui.chart.setPointerCapture(event.pointerId);

      if (event.pointerType === "touch" && state.crosshairPinned) {
        state.dragging = false;
        showTooltip(event, true);
        ui.chart.style.cursor = "crosshair";
        return;
      }

      state.dragging = true;
      state.dragX = event.clientX;
      if (event.pointerType !== "touch") hideTooltip();
      ui.chart.style.cursor = "grabbing";
      if (chartPointers.size >= 2 && !state.crosshairPinned) beginPinch();
    });
    function endDrag(event) {
      const wasTouch = event.pointerType === "touch";
      const tap = event.type === "pointerup" && chartPointers.has(event.pointerId) && chartPointers.size === 1 && !pointerMoved;
      chartPointers.delete(event.pointerId);
      if (chartPointers.size < 2) pinch = null;
      if (chartPointers.size === 1) {
        const remaining = [...chartPointers.values()][0];
        state.dragX = remaining.x;
        pointerOrigin = remaining;
      }
      state.dragging = chartPointers.size > 0 && !state.crosshairPinned;
      ui.chart.style.cursor = state.dragging ? "grabbing" : "crosshair";

      // Mobile: a single tap activates and pins the crosshair.
      // After that, the viewport remains fixed and dragging only moves the crosshair.
      if (tap) showTooltip(event, wasTouch || state.crosshairPinned);
    }
    ui.chart.addEventListener("pointerup", endDrag);
    ui.chart.addEventListener("pointercancel", endDrag);
    ui.chart.addEventListener("lostpointercapture", endDrag);
    ui.chart.addEventListener("dblclick", latest);
    ui.chart.addEventListener("wheel", (event) => {
      event.preventDefault();
      if (!state.rows.length) return;
      const ratio = Math.max(0, Math.min(1, (event.offsetX - 12) / Math.max(1, ui.chart.clientWidth - 84)));
      zoom(event.deltaY > 0 ? 10 : -10, ratio);
    }, { passive: false });
    window.addEventListener("resize", resizeAndDraw);

    function showError(error) {
      ui.status.className = "status";
      ui.status.textContent = error.name === "AbortError" ? "讀取逾時，請按重讀重試" : `讀取失敗：${error.message}`;
      if (!state.rows.length) {
        $("chartMessage").hidden = false;
        $("chartMessage").textContent = "資料尚未載入，請按「重讀」重試";
      }
    }

    for (const button of document.querySelectorAll("[data-indicator]")) {
      button.classList.toggle("active", state.indicators[button.dataset.indicator]);
      button.setAttribute("aria-pressed", String(state.indicators[button.dataset.indicator]));
    }
    updateAutoButton();
    updateMobileHelp();
    new ResizeObserver(resizeAndDraw).observe($("chartStage"));
    loadMeta({ preserveFile: !!state.file });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(() => {});
  </script>
</body>
</html>
