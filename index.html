<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>BTC 選擇權行動版</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="app-topbar"><div><p class="eyebrow">BTC OPTIONS</p><h1 id="pageTitle">市場總覽</h1></div><button id="refreshBtn" class="icon-btn" aria-label="重新整理">↻</button></header>
<main class="app-main"><section class="market-card" id="captureArea">
<section class="app-page active" data-page="home"><div class="hero-card"><div><span class="muted">歷史交易日</span><strong id="spotPrice">--</strong><small id="updatedAt">--</small></div><div class="right"><span id="status" class="status">連線中</span></div></div><div class="home-actions"><button class="nav-card" data-go="chain"><span class="nav-icon">T</span><b>T 字報價</b><small>CALL / PUT 履約價鏈</small><em>開啟報價 →</em></button><button class="nav-card" data-go="chart"><span class="nav-icon chart-icon">⌁</span><b>技術分析</b><small>K 線、均線、布林與量能</small><em>開啟圖表 →</em></button></div><div class="section-block"><div class="section-heading"><div><b>快速設定</b><small>先選擇資料，再進入報價或分析</small></div></div><div class="controls home-controls"><label>資料日期<select id="dateSelect"></select></label><label>來源週期<select id="intervalSelect"><option value="15m">15 分</option><option value="1h" selected>1 小時</option></select></label><label>合約到期日<select id="expirySelect"></select></label><label>K 線週期<select id="periodSelect"><option value="source">原始週期</option><option value="1h">1 小時</option><option value="4h">4 小時</option></select></label></div></div><div class="section-block info-strip"><div><span>核心功能</span><b>歷史 T 字鏈</b></div><div><span>分析模式</span><b>互動 K 線</b></div><div><span>裝置定位</span><b>Mobile First</b></div></div></section>
<section class="app-page" data-page="chain"><div style="display:none"><span id="chainCount">--</span><input id="strikeSearch" value=""></div><section class="chain-section"><div class="chain-scroll"><table class="chain-table"><thead><tr><th>CALL 買權</th><th>履約價</th><th>PUT 賣權</th></tr></thead><tbody id="chainBody"><tr><td colspan="3" class="empty">正在載入歷史報價…</td></tr></tbody></table></div></section></section>
<section class="app-page" data-page="chart"><section class="op-chart"><div class="op-quote-head"><div class="op-symbol"><small>BTC 選擇權</small><h2 id="symbolLabel">尚未選擇</h2></div><div class="op-last"><strong id="lastPrice">--</strong><span id="changePct">--</span></div></div><div class="op-periods" id="periodTabs"><button class="period-btn active" data-period="source">原始</button><button class="period-btn" data-period="1h">1小時</button><button class="period-btn" data-period="4h">4小時</button></div><div class="op-ohlc"><span>開<b id="openValue">--</b></span><span>高<b id="highValue">--</b></span><span>低<b id="lowValue">--</b></span><span>收<b id="closeValue">--</b></span><span>量<b id="volumeValue">--</b></span><span>筆<b id="tradesValue">--</b></span></div><div class="op-indicators" id="chartTools"><button class="toggle active" data-indicator="ma7">MA7</button><button class="toggle" data-indicator="ma20">MA20</button><button class="toggle" data-indicator="bb">布林</button><button class="toggle active" data-indicator="highLow">高低</button><button class="toggle active" data-indicator="volume">成交量</button><button class="toggle" data-action="fit">全部</button><button class="toggle" data-action="png">PNG</button></div><div class="chart-wrap op-chart-wrap" id="chartWrap"><canvas id="chart"></canvas><div id="chartTip" class="chart-tip"></div><div class="gesture-hint">拖曳平移 · 雙指縮放 · 點按查看 OHLC</div></div></section></section>
</section><button id="captureBtn" class="primary">下載完整報價畫面</button><p class="hint">歷史公開行情僅供參考，不構成投資建議。</p></main><nav class="bottom-nav" aria-label="主要導覽"><button class="bottom-item active" data-tab="home"><span>⌂</span><b>首頁</b></button><button class="bottom-item" data-tab="chain"><span>T</span><b>報價</b></button><button class="bottom-item" data-tab="chart"><span>⌁</span><b>分析</b></button></nav><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="history.js"></script><script>const pageNames={home:"市場總覽",chain:"T 字報價",chart:"技術分析"};function switchPage(name){document.querySelectorAll('.app-page').forEach(p=>p.classList.toggle('active',p.dataset.page===name));document.querySelectorAll('.bottom-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.getElementById('pageTitle').textContent=pageNames[name]||'BTC 選擇權';window.scrollTo({top:0,behavior:'smooth'});if(name==='chart')setTimeout(()=>window.dispatchEvent(new Event('resize')),60)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchPage(b.dataset.tab));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>switchPage(b.dataset.go));document.getElementById('chainBody').addEventListener('click',e=>{if(e.target.closest('[data-symbol]'))setTimeout(()=>switchPage('chart'),80)});document.getElementById('periodTabs').addEventListener('click',e=>{const b=e.target.closest('[data-period]');if(!b)return;const s=document.getElementById('periodSelect');s.value=b.dataset.period;s.dispatchEvent(new Event('change'));document.querySelectorAll('.period-btn').forEach(x=>x.classList.toggle('active',x===b))});</script></body></html>
